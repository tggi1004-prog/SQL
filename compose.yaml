services:
  db:
    image: postgres:18
    container_name: shoppingmall_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: shopping_mall

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - shoppingmall_data:/var/lib/postgresql

volumes:
  shoppingmall_data:
